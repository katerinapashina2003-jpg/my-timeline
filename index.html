    }

    }

      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .page-header h1 {
      margin: 12px 0;
      color: #000000;

      line-height: 1.1;

    }

      max-width: 680px;

    */

    #timeline-embed .tl-timeline,

    #timeline-embed .tl-slide-content,

    #timeline-embed .tl-text-content,
    #timeline-embed .tl-timenav,
    #timeline-embed .tl-timenav-background,

    #timeline-embed .tl-slide-content h3,
    #timeline-embed .tl-text h1,
    #timeline-embed .tl-text h2,
    #timeline-embed .tl-text h3 {
      color: #000000 !important;
    }

    /* Основной текст */
    #timeline-embed .tl-text-content,
    #timeline-embed .tl-text-content p,
    #timeline-embed .tl-slide-content p,
    #timeline-embed .tl-slide-content li,
    #timeline-embed .tl-caption,
    #timeline-embed .tl-credit {
      color: var(--tl-text) !important;
    }

    /* Подписи событий на нижней временной шкале */
    #timeline-embed .tl-timemarker-text,
    #timeline-embed .tl-timemarker-text h2,
    #timeline-embed .tl-timemarker-text h2 a,
    #timeline-embed .tl-timeaxis-tick-text,
    #timeline-embed .tl-timeaxis-major .tl-timeaxis-tick-text,

    #timeline-embed .tl-timegroup-message {
      color: #000000 !important;

    #timeline-embed .tl-slide,
    #timeline-embed .tl-slide-content,
    #timeline-embed .tl-timemarker-content-container {
      background-color: #FFFFFF !important;

    #timeline-embed .tl-timeaxis,

    #timeline-embed .tl-timemarker,
    #timeline-embed .tl-timemarker-line,
    #timeline-embed .tl-timemarker-timespan {
      border-color: var(--tl-line) !important;
    }

    #timeline-embed a,

    #timeline-embed .tl-menubar-button,
    #timeline-embed .tl-slidenav-content {

    }

      .page-header {
        padding: 26px 18px 18px;
      }

        height: 600px;
      }
    }
  </style>
</head>
