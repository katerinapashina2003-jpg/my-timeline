
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ОТ ЭВМ К AI</title>

  <!-- Базовые стили TimelineJS -->
  <link
    rel="stylesheet"
    href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css"
  >

  <!-- Твоя тема с GitHub Gist -->
  <link
    rel="stylesheet"
    href="https://gist.githubusercontent.com/katerinapashina2003-jpg/8473226532dce57791d51bbb49dfdcce/raw/timeline-elegant-theme.css"
  >

  <!-- Дополнительное оформление страницы -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #FAF8F3;
      color: #172B4D;
      font-family: Georgia, "Times New Roman", serif;
    }

    .page-header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 38px 28px 24px;
    }

    .eyebrow {
      color: #087E8B;
      font: 600 12px/1.5 Arial, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .page-header h1 {
      margin: 12px 0;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.1;
      font-weight: 500;
    }

    .page-header p {
      max-width: 680px;
      color: #52657D;
      font: 16px/1.7 Arial, sans-serif;
    }

    #timeline-embed {
      width: 100%;
      height: 650px;
      background: #FAF8F3;
    }

    .page-footer {
      padding: 18px 24px 28px;
      text-align: center;
      color: #52657D;
      font: 12px/1.6 Arial, sans-serif;
    }

    @media (max-width: 600px) {
      .page-header {
        padding: 26px 18px 18px;
      }

      #timeline-embed {
        height: 600px;
      }
    }
  </style>
</head>

<body>
  <header class="page-header">
    <div class="eyebrow">Как меняется работа историка?</div>
    <h1>My Timeline</h1>
    <p>
      Explore the events, people and moments that shaped this story.
    </p>
  </header>

  <!-- Здесь TimelineJS отобразит события из Google Sheets -->
  <div id="timeline-embed"></div>

  <footer class="page-footer">
    Timeline · An interactive visual story
  </footer>

  <!-- Библиотека TimelineJS -->
  <script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>

  <!-- Подключение Google-таблицы -->
  <script>
    const spreadsheetURL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vS_yaxgsHiYvgPU2TDFuC4d599W2DTZCVeo4C4M91adaPYFLxKlEU0VJTjnWHAW_IcHv-ALZleQhsai/pubhtml";

    const options = {
      initial_zoom: 2,
      language: "en"
    };

    const timeline = new TL.Timeline(
      "timeline-embed",
      spreadsheetURL,
      options
    );
  </script>
</body>
</html>
